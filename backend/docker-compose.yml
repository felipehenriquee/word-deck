services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=db;Port=3306;Database=backend;User=root;Password=root
      Database__MigrateOnStartup: 'true'
      Jwt__Secret: ${JWT_SECRET:?defina JWT_SECRET no .env (copie de .env.example)}
      Cors__Origin: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: backend
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -proot --silent']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
